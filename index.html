<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SUNSTRIP — an OutRun tribute</title>
  <meta name="description" content="SUNSTRIP — a pseudo-3D arcade road race. Fifteen stages, one sunset: pick your fork, beat the clock, drift, slipstream and chain near misses. Zero assets, all code.">
  <link rel="canonical" href="https://melvincarvalho.github.io/sunstrip/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fff4c8'/%3E%3Cstop offset='1' stop-color='%23ff8a4a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='12' fill='%231a2340'/%3E%3Ccircle cx='32' cy='30' r='18' fill='url(%23g)'/%3E%3Crect x='10' y='34' width='44' height='3' fill='%231a2340'/%3E%3Crect x='10' y='40' width='44' height='4' fill='%231a2340'/%3E%3Cpath d='M8 60 L28 44 L36 44 L56 60Z' fill='%23636469'/%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SUNSTRIP — an OutRun tribute">
  <meta property="og:description" content="Fifteen stages, one sunset. Pick your fork, beat the clock. Zero assets, all code.">
  <meta property="og:url" content="https://melvincarvalho.github.io/sunstrip/">
  <meta property="og:image" content="https://melvincarvalho.github.io/sunstrip/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#10131f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #10131f;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; touch-action: none; outline: none; }
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 2;
      align-items: center; justify-content: center; flex-direction: column; gap: 16px;
      background: #10131f; color: #ffd84a;
      font: italic 900 22px 'Arial Black', system-ui, sans-serif; text-align: center; letter-spacing: 1px;
    }
    #rotate span { font-size: 64px; display: block; animation: spin 2.4s ease-in-out infinite; }
    @keyframes spin { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    noscript { color: #fff; font: 18px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="c" role="img" aria-label="SUNSTRIP — an arcade road racing game. Arrow keys or WASD to drive, Enter to select, Escape to pause."></canvas>
  <div id="rotate" aria-hidden="true"><span>📱</span>ROTATE TO LANDSCAPE<small style="font-size:14px;color:#c3d2e8">SUNSTRIP plays sideways</small></div>
  <noscript>SUNSTRIP needs JavaScript to run.</noscript>
  <div id="fail" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#ffd84a;font:italic 900 20px 'Arial Black',system-ui,sans-serif;text-align:center;padding:24px">SUNSTRIP couldn't start in this browser.<br>Try a recent Chrome, Firefox, Safari or Edge.</div>
  <script>
    // boot watchdog: any script error before the game is up shows the notice at
    // once; a slow network just gets "still loading". The game removes #fail on boot.
    (function () {
      var MSG = "SUNSTRIP couldn't start in this browser.<br>Try a recent Chrome, Firefox, Safari or Edge.";
      function fail(e) {
        // resource 404s from extensions etc. aren't script failures
        if (e && e.target && e.target !== window && e.target.tagName !== 'SCRIPT') return;
        var f = document.getElementById('fail'); if (f && !window.__SUNSTRIP) { f.innerHTML = MSG; f.style.display = 'flex'; }
      }
      window.addEventListener('error', fail, true);
      window.__sunstripFail = fail;
      setTimeout(function () {
        var f = document.getElementById('fail');
        if (f && !window.__SUNSTRIP && f.style.display !== 'flex') { f.innerHTML = 'Still loading SUNSTRIP…'; f.style.display = 'flex'; }
      }, 15000);
    })();
  </script>
  <script type="module" src="game.js" onerror="window.__sunstripFail()"></script>
</body>
</html>
