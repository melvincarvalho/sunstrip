<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SUNSTRIP — an OutRun tribute</title>
  <meta name="description" content="SUNSTRIP — an OutRun tribute built by a harsh-critic agent loop. Pseudo-3D coastal highway, branching stages, radio synth. Zero assets, all code.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SUNSTRIP — an OutRun tribute">
  <meta property="og:description" content="Pseudo-3D coastal highway, branching stages, radio synth. Zero assets, all code.">
  <meta property="og:url" content="https://melvincarvalho.github.io/sunstrip/">
  <meta property="og:image" content="https://melvincarvalho.github.io/sunstrip/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1a2340">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #10131f;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    canvas {
      max-width: 100vw; max-height: 100vh;
      max-height: 100dvh;
      aspect-ratio: 16 / 9;
      width: 100%;
      image-rendering: auto;
      cursor: pointer;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #rotate {
      display: none;
      position: fixed; left: 50%; top: 14%;
      transform: translateX(-50%);
      padding: 10px 18px; border-radius: 999px;
      background: rgba(10, 14, 26, 0.85); color: #ffd84a;
      font: 600 14px system-ui, sans-serif;
      letter-spacing: 1px; white-space: nowrap;
      pointer-events: none;
    }
    @media (orientation: portrait) and (max-width: 700px) {
      #rotate { display: block; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="rotate">↻ ROTATE FOR THE FULL-WIDTH ROAD</div>
  <script type="module" src="game.js"></script>
</body>
</html>
